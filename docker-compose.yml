services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_local_password
      POSTGRES_DB: hub
    ports: ["127.0.0.1:54329:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ["127.0.0.1:63799:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: node dist/scripts/migrate.js
    env_file: .env
    environment: &backend_env
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PATH: /app/.data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    build: .
    command: node dist/apps/api/src/main.js
    env_file: .env
    environment: *backend_env
    ports: ["127.0.0.1:3001:3001"]
    volumes: [uploads:/app/.data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: .
    command: node dist/apps/api/src/worker.js
    env_file: .env
    environment: *backend_env
    volumes: [uploads:/app/.data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "dist/scripts/worker-health.js"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes: [ollama_data:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
volumes:
  postgres_data:
  redis_data:
  uploads:
  ollama_data:
